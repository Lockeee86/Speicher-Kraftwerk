# SKVE Collector – Portainer-Stack
# Deploy in Portainer: Stacks → Add stack → "Repository" → dieses Git-Repo,
# Compose-Pfad: docker-compose.yml. Die Variablen unten im Portainer-Feld
# "Environment variables" setzen (mindestens SKVE_API_KEY und die Passwörter).
#
# Nur lesende API-Nutzung. Der VPP-/POST-Schreibpfad wird nicht verwendet.

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: skve-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-skve}
      POSTGRES_USER: ${DB_USER:-skve}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?bitte DB_PASSWORD in Portainer setzen}
    volumes:
      - skve_db:/var/lib/postgresql/data
      # init.sql läuft nur beim allerersten Start (leeres Volume)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skve} -d ${DB_NAME:-skve}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Kein Port nach außen nötig – nur Grafana & Collector greifen intern zu.
    # Zum Anbinden von Power BI aus dem LAN die nächste Zeile einkommentieren:
    # ports: ["5432:5432"]

  collector:
    build: ./collector
    container_name: skve-collector
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      SKVE_API_KEY: ${SKVE_API_KEY:?bitte SKVE_API_KEY in Portainer setzen}
      SKVE_API_BASE: ${SKVE_API_BASE:-https://www.speicher-kraftwerk.de/api}
      SKVE_CHP_IDS: ${SKVE_CHP_IDS:-499,500,501,502}
      SKVE_PRICE_SERIES: ${SKVE_PRICE_SERIES:-DAA,IDA}
      SKVE_FORECAST_MARKETS: ${SKVE_FORECAST_MARKETS:-DAA}
      SKVE_INITIAL_START_DATE: ${SKVE_INITIAL_START_DATE:-}
      SKVE_BACKFILL_FROM: ${SKVE_BACKFILL_FROM:-}
      RUN_INTERVAL_SEC: ${RUN_INTERVAL_SEC:-86400}
      RUN_ONCE: ${RUN_ONCE:-false}
      OVERLAP_HOURS: ${OVERLAP_HOURS:-6}
      FUTURE_HORIZON_DAYS: ${FUTURE_HORIZON_DAYS:-2}
      BACKFILL_FALLBACK_DAYS: ${BACKFILL_FALLBACK_DAYS:-3}
      MAX_CHUNK_DAYS: ${MAX_CHUNK_DAYS:-14}
      CHUNK_PAUSE_SEC: ${CHUNK_PAUSE_SEC:-0.5}
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-skve}
      DB_USER: ${DB_USER:-skve}
      DB_PASSWORD: ${DB_PASSWORD}

  grafana:
    # Eigenes Image mit eingebackenem Provisioning (Datenquelle + Dashboards).
    # Bind-Mounts aus dem Git-Repo kommen in Portainer/dind-Setups nicht an.
    build: ./grafana
    container_name: skve-grafana
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?bitte GF_ADMIN_PASSWORD in Portainer setzen}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Datenquelle-Zugang für die (eingebackene) Provisioning-Datei
      DB_NAME: ${DB_NAME:-skve}
      DB_USER: ${DB_USER:-skve}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${GF_PORT:-3000}:3000"     # im LAN erreichbar: http://<raspi-ip>:3000
    volumes:
      - skve_grafana:/var/lib/grafana

  reporter:
    # KI-Tagesreport: liest die DB, lässt Claude einen Bericht schreiben,
    # schickt ihn per Telegram/E-Mail. Standard: täglich 09:00 Uhr.
    build: ./reporter
    container_name: skve-reporter
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-skve}
      DB_USER: ${DB_USER:-skve}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
      REPORT_HOUR: ${REPORT_HOUR:-9}
      REPORT_MINUTE: ${REPORT_MINUTE:-0}
      RUN_ONCE: ${REPORT_RUN_ONCE:-false}
      # Claude (Pflicht für den Report – in Portainer setzen)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REPORT_MODEL: ${REPORT_MODEL:-claude-opus-5}
      REPORT_EFFORT: ${REPORT_EFFORT:-medium}
      REPORT_PRICE_THRESHOLD: ${REPORT_PRICE_THRESHOLD:-}
      # Zustellung – Telegram (optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Zustellung – MS Teams (optional, Incoming Webhook)
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      # Zustellung – E-Mail (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}

volumes:
  skve_db:
  skve_grafana:
